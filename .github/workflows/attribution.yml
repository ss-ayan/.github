name: attribution

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  no-ai-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject AI attribution in commits and PR body
        env:
          BASE: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pat='^co-authored-by:.*(claude|anthropic)|generated with \[?claude code|claude\.com/claude-code'
          fail=0
          if git log --format=%B "origin/$BASE..HEAD" | grep -iE "$pat"; then
            echo "::error::commit messages contain AI attribution lines"; fail=1
          fi
          if printf '%s\n' "$PR_BODY" | grep -iE "$pat"; then
            echo "::error::PR description contains AI attribution lines"; fail=1
          fi
          exit $fail
